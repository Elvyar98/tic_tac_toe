<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <h1 class="title">Tic-Tac-Toe</h1>
      <hr />
    </div>
    <main>
      <div class="active-player">
        <h2 class="active-player-text"></h2>
      </div>
      <dialog id="new-game">
        <form action="" method="dialog">
          <div class="player-one-input">
            <label for="player-one">Enter your name: </label>
            <input
              type="text"
              name="name"
              id="player-one"
              required="required"
            />
          </div>
          <div class="player-two-input">
            <label for="player-two">Enter your name: </label>
            <input
              type="text"
              name="name"
              id="player-one"
              required="required"
            />
          </div>
          <div class="start-game-button">
            <button type="submit" value="Start game"></button>
          </div>
        </form>
      </dialog>
      <div class="gameboard">
        <div class="grid-cell" data-position="0">0</div>
        <div class="grid-cell" data-position="1">1</div>
        <div class="grid-cell" data-position="2">2</div>
        <div class="grid-cell" data-position="3">3</div>
        <div class="grid-cell" data-position="4">4</div>
        <div class="grid-cell" data-position="5">5</div>
        <div class="grid-cell" data-position="6">6</div>
        <div class="grid-cell" data-position="7">7</div>
        <div class="grid-cell" data-position="8">8</div>
      </div>
      <dialog id="status-box">
        <div class="result-bar">
          <h2 class="result-text"></h2>
        </div>
        <div class="score-bar">
          <span class="player-one-name"></span>
          <span class="player-one-score"></span>
          <span class="player-two-name"></span>
          <span class="player-two-score"></span>
        </div>
        <div class="round-bar">
          <h3 class="round-text">ROUND:</h3>
          <span class="round-number"></span>
        </div>
        <div class="button-bar">
          <button
            commandfor="status-box"
            command="close"
            type="button"
            class="restart-button"
          >
            Restart
          </button>
          <button
            commandfor="status-box"
            command="close"
            type="button"
            class="new-round-button"
          >
            New Round
          </button>
        </div>
      </dialog>
    </main>
  </body>
</html>
